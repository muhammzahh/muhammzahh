<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Hamzah - Junior Web Developer. Animated Chrome dino game banner." xmlns:c2pa="http://c2pa.org/manifest">
<style>
  .bg{fill:#0d1117;stroke:#30363d;stroke-width:2}
  .px{fill:#c9d1d9;shape-rendering:crispEdges}
  .title{font-family:'Courier New',Courier,monospace;font-weight:700;fill:#e6edf3}
  .sub{font-family:'Courier New',Courier,monospace;fill:#8b949e}
  .dino{animation:jump 4.5s infinite}
  .cactus{animation:run 9s linear infinite}
  .cactusB{animation-delay:-4.5s}
  .ground{animation:scroll 1.8s linear infinite}
  .cloud{opacity:.18;animation:cloud 30s linear infinite}
  .cloud2{animation-duration:42s;animation-delay:-15s}
  .legA{animation:legA .3s steps(1) infinite}
  .legB{animation:legB .3s steps(1) infinite}
  .blink{animation:blink 1s steps(1) infinite}
  @keyframes jump{
    0%,52%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.7,.4,1)}
    70%{transform:translateY(-84px);animation-timing-function:cubic-bezier(.6,0,.8,.3)}
    90%,100%{transform:translateY(0)}
  }
  @keyframes run{from{transform:translateX(950px)}to{transform:translateX(-60px)}}
  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-200px)}}
  @keyframes cloud{from{transform:translateX(950px)}to{transform:translateX(-80px)}}
  @keyframes legA{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes legB{0%,49%{opacity:0}50%,100%{opacity:1}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
</style>
<rect class="bg" x="1" y="1" width="898" height="258" rx="14"/>

<g class="cloud px"><g transform="translate(0,45)"><rect x="16" y="0" width="16" height="4"/><rect x="8" y="4" width="32" height="4"/><rect x="4" y="8" width="40" height="4"/><rect x="0" y="12" width="48" height="4"/></g></g>
<g class="cloud cloud2 px"><g transform="translate(0,95)"><rect x="16" y="0" width="16" height="4"/><rect x="8" y="4" width="32" height="4"/><rect x="4" y="8" width="40" height="4"/><rect x="0" y="12" width="48" height="4"/></g></g>

<text class="title" x="300" y="85" font-size="46">Hi, I'm Hamzah<tspan class="blink">_</tspan></text>
<text class="title" x="300" y="122" font-size="24" style="fill:#7aa2f7">Junior Web Developer</text>
<text class="sub" x="300" y="152" font-size="16">Frontend  |  Backend  |  Mobile</text>
<text class="sub" x="300" y="176" font-size="12" style="opacity:.7">No connection? No problem. Keep jumping.</text>

